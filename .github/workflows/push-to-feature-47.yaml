name: Docker Build and Push

on:
  push:
    branches:
      - feature-47

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/python-flask-exercise:latest
      
      - name: Run Container Locally for Testing
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/python-flask-exercise:latest
          docker run -d --name test-container -p 5000:5000 ${{ secrets.DOCKERHUB_USERNAME }}/python-flask-exercise:latest
          # Give the app a few seconds to start up
          sleep 5
      
      - name: Run Unit Tests
        run: docker exec test-container python Test.py

      - name: Test (Curl)
        run: |
          curl -s http://localhost:5000 | grep -q "Hello, World!"
          # grep -q returns an exit code of 0 if found, 1 if not.

      - name: Cleanup
        if: always()
        run: docker rm -f test-container