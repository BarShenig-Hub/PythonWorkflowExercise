name: Production Build and Test

on:
  push:
    branches:
      - main

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/python-flask-exercise-my-app:prod

      - name: Run Container Locally for Testing
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/python-flask-exercise-my-app:prod
          docker run -d --name test-container -p 5000:5000 ${{ secrets.DOCKERHUB_USERNAME }}/python-flask-exercise-my-app:prod
          # Give the app a few seconds to start up
          sleep 5

      - name: Smoke Test (Curl)
        run: |
          # Replace 'localhost:5000' and the expected string with your app's specifics
          RESPONSE=$(curl -s http://localhost:5000)
          echo "App responded with: $RESPONSE"
          
          if [[ "$RESPONSE" == *"Hello World"* ]]; then
            echo "Test Passed!"
          else
            echo "Test Failed! Response was not as expected."
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: docker rm -f test-container